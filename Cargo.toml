[package]
name = "boulder-dash"
version = "0.3.0"
edition = "2024"
description = "Portable native Rust remake using resources extracted from the supplied CPC disk"

[features]
exit-effects-demo = []

[dependencies]
gilrs = "0.11.2"
macroquad = { version = "0.4.16", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
